<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AprilTag ROS Detector</title>
  <style>
    :root {
      --bg: #0f141c;
      --panel: #171f2b;
      --panel-2: #1e2938;
      --border: #2a374b;
      --text: #e6edf6;
      --muted: #8ea0b8;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.45;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .chip strong { color: var(--text); font-weight: 600; }
    .chip.ok strong { color: var(--ok); }
    .chip.warn strong { color: var(--warn); }
    .grid {
      display: grid;
      grid-template-columns: minmax(320px, 1.15fr) minmax(320px, 1fr);
      gap: 16px;
    }
    @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .card h2 {
      margin: 0 0 10px 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .fov-wrap {
      background: #0a0e14;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      width: 100%;
    }
    svg { width: 100%; height: 100%; display: block; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      padding: 7px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bold { font-weight: bold; }
    .warn-label { color: var(--warn); }
    .row-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 12px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
    input, select {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 13px;
    }
    input[type="number"] { width: 100px; }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn.secondary { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
    .btn.danger { background: rgba(239, 68, 68, 0.16); border: 1px solid var(--danger); color: #fca5a5; padding: 4px 8px; font-size: 12px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { font-size: 12px; margin-top: 8px; min-height: 18px; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--danger); }
    .empty { color: var(--muted); text-align: center; padding: 18px 0; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AprilTag ROS Detector</h1>
      <div class="sub">Isaac ROS GPU 官方检测节点 + 可扩展多尺寸 Tag ID 实时测距与管理</div>
    </div>
    <div class="chips" id="chips">
      <span class="chip">状态: <strong>连接中...</strong></span>
    </div>
  </header>

  <div class="grid">
    <section class="card">
      <h2>
        <span>视场角实时检测叠加（零图传带宽）</span>
        <span class="mono" id="camMeta" style="font-size:12px;color:var(--muted)">1280×720</span>
      </h2>
      <div class="fov-wrap">
        <svg id="fovSvg" preserveAspectRatio="xMidYMid meet">
          <path id="fovGrid" stroke="#1f2937" stroke-dasharray="6 6" />
          <g id="fovDetections"></g>
          <text id="fovEmpty" display="none" text-anchor="middle" fill="#64748b" font-size="22">当前画面未检出匹配标签</text>
        </svg>
        <template id="fovMarker"><svg><g>
          <polygon fill="rgba(34,197,94,0.14)" stroke="currentColor" stroke-width="3" />
          <circle r="5" fill="currentColor" />
          <rect height="24" rx="4" fill="rgba(15,20,28,0.85)" stroke="currentColor" />
          <text fill="#f8fafc" font-size="16" font-family="monospace"></text>
        </g></svg></template>
      </div>
      <h2 style="margin-top:16px">实时检出目标（3D 距离与相机坐标系位姿）</h2>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>备注</th>
              <th>物理边长</th>
              <th>3D 距离</th>
              <th>位置 X / Y / Z (m)</th>
              <th>姿态 R / P / Y (°)</th>
              <th>像素边长</th>
            </tr>
          </thead>
          <tbody id="detBody">
            <tr><td colspan="7" class="empty">等待检测帧...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>
        <span>标签 ID 与物理边长配置（热更新，免重启）</span>
        <span class="chip warn" id="overrideBadge" style="display:none"><strong>已启用 UI 热覆盖</strong></span>
      </h2>
      <div class="row-controls">
        <label>
          过滤模式
          <select id="filterMode">
            <option value="configured_only">仅检测下方配置列表 (configured_only)</option>
            <option value="all_detected">检测同族全部标签 (all_detected)</option>
          </select>
        </label>
        <label>
          默认边长 (m)
          <input id="defaultSize" type="number" step="0.001" min="0.001" max="10" value="0.289" />
        </label>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th style="width:90px">Tag ID</th>
              <th style="width:120px">黑框边长 (m)</th>
              <th>备注名</th>
              <th style="width:68px">操作</th>
            </tr>
          </thead>
          <tbody id="tagRows"></tbody>
        </table>
      </div>
      <div class="row-controls" style="margin-top:12px">
        <button class="btn secondary" id="addTagBtn">+ 添加标签</button>
        <button class="btn" id="applyBtn">立即应用（热生效）</button>
        <button class="btn secondary" id="resetBtn">恢复配置中心默认值</button>
      </div>
      <div class="msg" id="saveMsg"></div>

      <h2 style="margin-top:16px">Isaac ROS 官方 AprilTagNode 运行参数</h2>
      <div class="mono" id="isaacMeta" style="font-size:12px;color:var(--muted);white-space:pre-wrap"></div>
    </section>
  </div>

  <script>
    const API_BASE = '../api';
    let editTags = [];
    let formInitialized = false;

    const $ = (id) => document.getElementById(id);

    function renderTagRows() {
      const tbody = $('tagRows');
      tbody.innerHTML = '';
      if (!editTags.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">暂无指定标签（all_detected 模式下按默认边长计算）</td></tr>';
        return;
      }
      editTags.forEach((tag) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="number" min="0" max="65535" step="1" data-field="id" style="width:82px" /></td>
          <td><input type="number" min="0.001" max="10" step="0.001" data-field="size_m" style="width:104px" /></td>
          <td><input type="text" maxlength="64" data-field="label" style="width:100%" /></td>
          <td><button class="btn danger" data-del>删除</button></td>
        `;
        for (const input of tr.querySelectorAll('input')) {
          input.value = tag[input.dataset.field] ?? '';
        }
        tbody.appendChild(tr);
      });
    }

    $('tagRows').addEventListener('change', ({ target }) => {
      const field = target.dataset.field;
      if (field) {
        editTags[target.closest('tr').sectionRowIndex][field] = field === 'label' ? target.value : Number(target.value);
      }
    });
    $('tagRows').addEventListener('click', ({ target }) => {
      const button = target.closest('[data-del]');
      if (button) {
        editTags.splice(button.closest('tr').sectionRowIndex, 1);
        renderTagRows();
      }
    });

    function renderFov(width, height, detections) {
      const svg = $('fovSvg');
      const viewBox = `0 0 ${width} ${height}`;
      const empty = $('fovEmpty');
      if (svg.getAttribute('viewBox') !== viewBox) {
        svg.setAttribute('viewBox', viewBox);
        $('fovGrid').setAttribute('d', `M${width / 2} 0V${height} M0 ${height / 2}H${width}`);
        empty.setAttribute('x', width / 2);
        empty.setAttribute('y', height / 2 - 12);
      }
      empty.style.display = detections.length ? 'none' : 'inline';
      const markers = $('fovDetections');
      while (markers.childElementCount > detections.length) markers.lastElementChild.remove();
      detections.forEach((d, index) => {
        const marker = markers.children[index] || markers.appendChild(
          $('fovMarker').content.querySelector('g').cloneNode(true));
        const [polygon, circle, rect, text] = marker.children;
        marker.style.color = d.configured ? '#22c55e' : '#f59e0b';
        polygon.setAttribute('points', d.corners_px?.length === 4
          ? d.corners_px.map((p) => p.join(',')).join(' ') : '');
        const cx = d.center_px ? d.center_px[0] : width / 2;
        const cy = d.center_px ? d.center_px[1] : height / 2;
        const title = `ID ${d.id}${d.label ? ' (' + d.label + ')' : ''} · ${d.distance_m.toFixed(3)} m`;
        circle.setAttribute('cx', cx);
        circle.setAttribute('cy', cy);
        rect.setAttribute('x', cx - 10);
        rect.setAttribute('y', Math.max(8, cy - 34));
        rect.setAttribute('width', Math.max(150, title.length * 9));
        text.setAttribute('x', cx - 2);
        text.setAttribute('y', Math.max(24, cy - 18));
        text.textContent = title;
      });
    }

    function chip(label, value, state = '') {
      const el = document.createElement('span');
      el.className = `chip ${state}`;
      const strong = document.createElement('strong');
      strong.textContent = value;
      el.append(`${label}: `, strong);
      return el;
    }

    function renderStatus(s) {
      const ir = s.isaac_ros || {};
      const alive = s.last_frame_age_ms !== null && s.last_frame_age_ms < 2000;
      $('chips').replaceChildren(
        chip('检测流', alive ? s.fps + ' Hz' : '等待相机帧', alive ? 'ok' : 'warn'),
        chip('后端', ir.backend || '-'), chip('标志族', ir.tag_family || '-'),
        chip('Domain', ir.ros_domain_id ?? '-'), chip('发现范围', ir.discovery_range || '-'),
      );
      const cam = s.camera || { width: 1280, height: 720 };
      $('camMeta').textContent = `${cam.width}×${cam.height}` + (cam.fx ? ` · fx=${cam.fx} fy=${cam.fy}` : '');
      $('overrideBadge').style.display = s.override_active ? 'inline-flex' : 'none';
      $('isaacMeta').textContent = JSON.stringify({
        backends: ir.backend,
        tag_family: ir.tag_family,
        base_size_m: ir.base_size_m,
        max_tags: ir.max_tags,
        tile_size: ir.tile_size,
        optical_frame: s.optical_frame || 'waiting',
        frames_total: s.frames_total,
      }, null, 2);

      const dets = s.detections || [];
      renderFov(cam.width || 1280, cam.height || 720, dets);
      const detBody = $('detBody');
      if (!dets.length) {
        detBody.innerHTML = '<tr><td colspan="7" class="empty">当前视野内无检出标签</td></tr>';
      } else {
        detBody.replaceChildren(...dets.map((d) => {
          const tr = document.createElement('tr');
          function cell(value, className) {
            const td = tr.insertCell();
            td.className = className;
            td.textContent = value;
          }
          cell(d.id, 'mono bold');
          cell(d.label || (d.configured ? '-' : '默认尺寸'), !d.label && !d.configured ? 'warn-label' : '');
          cell(`${d.size_m.toFixed(3)} m`, 'mono');
          cell(`${d.distance_m.toFixed(3)} m`, 'mono bold');
          cell(d.position_m.map((v) => v.toFixed(3)).join(', '), 'mono');
          cell(d.rpy_deg.map((v) => v.toFixed(1)).join(', '), 'mono');
          cell(`${d.edge_px.toFixed(1)} px`, 'mono');
          return tr;
        }));
      }

      if (!formInitialized && s.rules) {
        editTags = (s.rules.tags || []).map((t) => ({ ...t }));
        $('filterMode').value = s.rules.filter_mode || 'configured_only';
        $('defaultSize').value = s.rules.default_size_m ?? 0.289;
        renderTagRows();
        formInitialized = true;
      }
    }

    $('addTagBtn').addEventListener('click', () => {
      const used = new Set(editTags.map((t) => Number(t.id)));
      let nextId = 1;
      while (used.has(nextId)) nextId += 1;
      editTags.push({ id: nextId, size_m: Number($('defaultSize').value) || 0.1, label: '' });
      renderTagRows();
    });

    $('applyBtn').addEventListener('click', async () => {
      const msg = $('saveMsg');
      msg.className = 'msg';
      msg.textContent = '正在应用...';
      try {
        const res = await fetch(`${API_BASE}/tags`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            filter_mode: $('filterMode').value,
            default_size_m: Number($('defaultSize').value),
            tags: editTags,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        editTags = data.rules.tags.map((t) => ({ ...t }));
        renderTagRows();
        msg.className = 'msg ok';
        msg.textContent = '已热更新生效，距离与 /tf 已按新尺寸实时重算。';
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = `应用失败: ${err.message}`;
      }
    });

    $('resetBtn').addEventListener('click', async () => {
      const msg = $('saveMsg');
      try {
        const res = await fetch(`${API_BASE}/tags/reset`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        editTags = data.rules.tags.map((t) => ({ ...t }));
        $('filterMode').value = data.rules.filter_mode;
        $('defaultSize').value = data.rules.default_size_m;
        renderTagRows();
        msg.className = 'msg ok';
        msg.textContent = '已恢复为 AivudaOS 配置中心参数。';
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = `恢复失败: ${err.message}`;
      }
    });

    async function poll() {
      try {
        const res = await fetch(`${API_BASE}/status`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        renderStatus(await res.json());
      } catch (err) {
        $('chips').replaceChildren(chip('状态', `未连接 (${err.message})`, 'warn'));
      }
    }

    poll();
    setInterval(poll, 250);
  </script>
</body>
</html>
